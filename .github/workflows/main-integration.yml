# Runs on every push to main (drives the README badge) and on manual dispatch.
# The jobs live in build-and-test.yml, shared with pr-check.yml.
name: Test & Build Status

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual trigger"
        required: false
        default: "Manual build"

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/build-and-test.yml
    with:
      reason: ${{ inputs.reason }}
