# This workflow runs on every pull request to provide fast feedback.
# It ensures code quality and that all unit tests pass before merging.
# The jobs live in build-and-test.yml, shared with main-integration.yml.
name: Pull Request Check

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

# A new push to the same pull request cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/build-and-test.yml
